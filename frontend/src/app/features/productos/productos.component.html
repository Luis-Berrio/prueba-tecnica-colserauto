<section class="pagina">
  <header class="pagina-encabezado">
    <div>
      <h1>Productos</h1>
      <p class="subtitulo">Catálogo de repuestos con su precio y existencias.</p>
    </div>
    <button mat-flat-button (click)="abrirFormulario()">
      <mat-icon>add</mat-icon>
      Nuevo producto
    </button>
  </header>

  <div class="tarjeta">
    @if (cargando()) {
      <mat-progress-bar mode="indeterminate" />
    }

    <div class="tabla-scroll">
      <table mat-table [dataSource]="productos()">
        <ng-container matColumnDef="codigo">
          <th mat-header-cell *matHeaderCellDef>Código</th>
          <td mat-cell *matCellDef="let p" class="suave">{{ p.codigo }}</td>
        </ng-container>
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let p" class="fuerte">{{ p.nombre }}</td>
        </ng-container>
        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let p" class="suave">{{ p.descripcion || '—' }}</td>
        </ng-container>
        <ng-container matColumnDef="precio">
          <th mat-header-cell *matHeaderCellDef class="num">Precio</th>
          <td mat-cell *matCellDef="let p" class="num fuerte">
            {{ p.precio | currency: 'COP' : 'symbol-narrow' : '1.0-0' }}
          </td>
        </ng-container>
        <ng-container matColumnDef="stock">
          <th mat-header-cell *matHeaderCellDef class="num">Stock</th>
          <td mat-cell *matCellDef="let p" class="num">
            <span
              class="chip"
              [class.chip-peligro]="p.stock <= 5"
              [class.chip-alerta]="p.stock > 5 && p.stock <= 15"
              [class.chip-ok]="p.stock > 15"
            >
              {{ p.stock }}
            </span>
          </td>
        </ng-container>
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let p" class="acciones">
            <button mat-icon-button aria-label="Editar" (click)="abrirFormulario(p)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button aria-label="Eliminar" (click)="eliminar(p)">
              <mat-icon>delete_outline</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnas"></tr>
        <tr mat-row *matRowDef="let fila; columns: columnas"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell vacio" [attr.colspan]="columnas.length">
            Aún no hay productos registrados
          </td>
        </tr>
      </table>
    </div>
  </div>
</section>
